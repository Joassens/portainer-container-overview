name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only; the end-to-end test (throwaway_update_test.py) needs a real Docker host and is not run here.
      - run: python -m unittest discover -s . -p "test_*.py" -v
